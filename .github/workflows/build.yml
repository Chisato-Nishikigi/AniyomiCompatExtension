name: Build

concurrency:
  group: build
  cancel-in-progress: true

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # Checkout source (extension)
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          path: src

      # Checkout builds branch (artifact repo)
      - name: Checkout builds
        uses: actions/checkout@v4
        with:
          ref: builds
          path: builds

      # Clean old cs3
      - name: Clean old builds
        run: rm -f builds/*.cs3 || true

      # Java 17
      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # Android SDK
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      # Build CloudStream extension
      - name: Build plugins
        run: |
          cd src
          chmod +x gradlew
          ./gradlew make makePluginsJson
          cp **/build/*.cs3 ../builds || true
          cp build/plugins.json ../builds

      # Commit result to builds branch
      - name: Push builds
        run: |
          cd builds
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git add .
          git commit -m "Build $GITHUB_SHA" || exit 0
          git push
